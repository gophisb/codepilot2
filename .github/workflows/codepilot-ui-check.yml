name: CodePilot2 UI Integrity Check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: node --check main.js

      - name: Check root page wiring
        run: |
          test -s index.html
          grep -Fq './main.js?v=20260922-stable' index.html
          test -s app.js
          ! grep -Fq '</script>' main.js

      - name: Check required UI elements
        run: |
          grep -Fq 'id="prompt"' index.html
          grep -Fq 'id="zipInput"' index.html
          grep -Fq 'id="files"' index.html
          grep -Fq 'id="codeView"' index.html
          grep -Fq 'id="preview"' index.html
