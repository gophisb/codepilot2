name: ZIP-PUSH

on:
  workflow_dispatch:
    inputs:
      project_name:
        required: true
        type: string
      payload:
        required: true
        type: string
      issue_number:
        required: true
        type: string
      asset_url:
        required: false
        default: ""
        type: string

permissions:
  issues: write
  contents: read

jobs:
  zip-push:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ inputs.project_name }}
      PAYLOAD: ${{ inputs.payload }}
      ISSUE_NUMBER: ${{ inputs.issue_number }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: Decode or download ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_URL: ${{ inputs.asset_url }}
        run: |
          set -euo pipefail
          if [ -n "$ASSET_URL" ]; then
            curl -sL --fail "$ASSET_URL" -o project.zip
          else
            base64 -d <<< "$PAYLOAD" > project.zip
          fi

      - name: Validate ZIP
        run: |
          set -euo pipefail
          size=$(stat -c%s project.zip)
          echo "ZIP_BYTES=$size" >> "$GITHUB_ENV"
          count=$(unzip -Z1 project.zip | awk '!/\/$/{n++} END{print n+0}')
          if [ "$count" -gt 200 ]; then exit 1; fi
          bad=""
          while IFS= read -r path; do
            case "$path" in
              */) continue;;
              /*|.git/*|.github/*|*../*|*./*) bad="$path"; break;;
            esac
          done < <(unzip -Z1 project.zip)
          [ -z "$bad" ] || { echo "Unsafe path: $bad"; exit 1; }

      - name: Extract without dropping large files
        run: |
          set -euo pipefail
          rm -rf zip-work
          mkdir -p zip-work
          unzip -q project.zip -d zip-work
          file_count=$(find zip-work -type f | wc -l)
          total_bytes=$(find zip-work -type f -printf '%s\n' | awk '{s+=$1} END{print s+0}')
          echo "PROJECT_FILE_COUNT=$file_count" >> "$GITHUB_ENV"
          echo "PROJECT_TOTAL_BYTES=$total_bytes" >> "$GITHUB_ENV"

      - name: Resolve repository
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          candidate=$(printf '%s' "$PROJECT_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9-]/-/g; s/-\{2,\}/-/g; s/^-*//; s/-*$//' | cut -c1-50)
          [ -n "$candidate" ] || candidate="zip-project-$(date +%s)"
          if gh api "repos/${GITHUB_REPOSITORY_OWNER}/$candidate" >/dev/null 2>&1; then
            candidate="$(printf '%s' "$candidate" | cut -c1-39)-$(date +%s)"
          fi
          echo "FINAL_REPO=$candidate" >> "$GITHUB_ENV"

      - name: Create repository
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: gh api --method POST user/repos -f "name=$FINAL_REPO" -F private=false >/dev/null

      - name: Add metadata
        run: |
          python3 - "$PROJECT_FILE_COUNT" "$PROJECT_TOTAL_BYTES" <<'PY'
          import json,sys
          with open("zip-work/generation-meta.json","w",encoding="utf-8") as f:
              json.dump({"source":"zip-import","file_count":int(sys.argv[1]),"total_bytes":int(sys.argv[2])},f,ensure_ascii=False,indent=2)
              f.write("\n")
          PY

      - name: Push complete project
        env:
          GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          cd zip-work
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -qm "Import project from ZIP"
          git branch -M main
          git remote add origin "https://x-access-token:${GH_REPO_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/${FINAL_REPO}.git"
          git push -u origin main

      - name: Report success
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "✅ ZIP-PUSH تم: https://github.com/${GITHUB_REPOSITORY_OWNER}/$FINAL_REPO — $PROJECT_FILE_COUNT files / $PROJECT_TOTAL_BYTES bytes"