name: CodePilot Run

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Project request"
        required: true
        type: string
      provider:
        description: "AI provider"
        required: true
        default: "gemini"
        type: choice
        options: [gemini, deepseek, openai, openrouter]
      stack:
        description: "Technology"
        required: true
        default: "HTML/CSS/JS"
        type: string
      platform:
        description: "Platform"
        required: true
        default: "Web / PWA"
        type: string
      project:
        description: "Repository name"
        required: true
        default: "my-codepilot-app"
        type: string
      request_id:
        description: "Request id"
        required: true
        default: "manual"
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PROVIDER: ${{ inputs.provider }}
      PROMPT: ${{ inputs.prompt }}
      STACK: ${{ inputs.stack }}
      PLATFORM: ${{ inputs.platform }}
      PROJECT: ${{ inputs.project }}
      REQUEST_ID: ${{ inputs.request_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        run: python3 .github/scripts/generate.py
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]
          test -n "$(find generated-project -type f -print -quit)"
          owner="$(gh api user --jq .login)"
          candidate="$PROJECT"
          n=2
          while gh repo view "$owner/$candidate" >/dev/null 2>&1; do
            candidate="$PROJECT-$n"
            n=$((n+1))
          done
          cd generated-project
          git init
          git config user.name "CodePilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "CodePilot: initial project"
          gh repo create "$owner/$candidate" --public --source . --remote origin --push
          echo "Repository: https://github.com/$owner/$candidate" >> "$GITHUB_STEP_SUMMARY"
