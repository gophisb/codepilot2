name: CodePilot Run
run-name: "CodePilot: ${{ github.event.client_payload.project }} [${{ github.event.client_payload.request_id }}]"

on:
  repository_dispatch:
    types: [codepilot_generate]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PROVIDER: ${{ github.event.client_payload.provider }}
      PROMPT: ${{ github.event.client_payload.prompt }}
      STACK: ${{ github.event.client_payload.stack }}
      PLATFORM: ${{ github.event.client_payload.platform }}
      PROJECT: ${{ github.event.client_payload.project }}
      REQUEST_ID: ${{ github.event.client_payload.request_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate
        run: python3 .github/scripts/generate.py
      - name: Publish
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then exit 1; fi
          test -n "$(find generated-project -type f -print -quit)"
          owner="$(gh api user --jq .login)"
          candidate="$PROJECT"
          n=2
          while gh repo view "$owner/$candidate" >/dev/null 2>&1; do
            candidate="$PROJECT-$n"
            n=$((n+1))
          done
          cd generated-project
          git init
          git config user.name "CodePilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "CodePilot: initial project"
          gh repo create "$owner/$candidate" --public --description "Generated by CodePilot2" --source . --remote origin --push
          echo "Repository: https://github.com/$owner/$candidate" >> "$GITHUB_STEP_SUMMARY"
