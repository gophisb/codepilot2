name: CodePilot Run
run-name: "CodePilot: ${{ inputs.project }} [${{ inputs.request_id }}]"

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Unique CodePilot2 request ID"
        required: true
        type: string
      project:
        description: "Target project repository name"
        required: true
        type: string
      provider:
        description: "AI provider"
        required: true
        type: choice
        options:
          - gemini
          - deepseek
          - openai
          - openrouter
      stack:
        description: "Technology stack"
        required: true
        type: string
      platform:
        description: "Target platform"
        required: true
        type: string
      prompt:
        description: "Application description"
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      PROVIDER: ${{ inputs.provider }}
      PROMPT: ${{ inputs.prompt }}
      STACK: ${{ inputs.stack }}
      PLATFORM: ${{ inputs.platform }}
      PROJECT: ${{ inputs.project }}
      REQUEST_ID: ${{ inputs.request_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate project
        run: python3 .github/scripts/generate.py
      - name: Publish project
        run: bash .github/scripts/publish.sh
