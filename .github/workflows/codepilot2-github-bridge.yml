name: CodePilot2 GitHub Bridge

on:
  issues:
    types: [opened]

jobs:
  bridge:
    if: github.event.issue.user.login == 'gophisb' && startsWith(github.event.issue.title, 'CodePilot2:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Dispatch request
        run: |
          python3 - <<'PY'
          import os,re,base64,json,urllib.request
          body=os.environ["ISSUE_BODY"]
          m=re.search(r"<!-- CodePilot2 request\n(.*?)\n-->",body,re.S)
          if not m: raise SystemExit("Invalid CodePilot2 request")
          meta={}
          for line in m.group(1).splitlines():
              if "=" in line:
                  k,v=line.split("=",1); meta[k.strip()]=v.strip()
          required=["request_id","project","provider","stack","platform","prompt_b64"]
          missing=[k for k in required if not meta.get(k)]
          if missing: raise SystemExit("Missing: "+", ".join(missing))
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,99}",meta["project"]):
              raise SystemExit("Invalid project")
          prompt=base64.b64decode(meta["prompt_b64"],validate=True).decode("utf-8")
          payload={"ref":"main","inputs":{
              "request_id":meta["request_id"],
              "project":meta["project"],
              "provider":meta["provider"],
              "stack":meta["stack"],
              "platform":meta["platform"],
              "prompt":prompt}}
          req=urllib.request.Request(
              "https://api.github.com/repos/gophisb/codepilot2/actions/workflows/codepilot-run.yml/dispatches",
              data=json.dumps(payload).encode(),
              headers={"Accept":"application/vnd.github+json",
                       "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "X-GitHub-Api-Version":"2026-03-10",
                       "Content-Type":"application/json"},
              method="POST")
          with urllib.request.urlopen(req,timeout=30) as r:
              if r.status not in (200,201,204): raise SystemExit("Dispatch HTTP "+str(r.status))
          PY

  publish:
    if: github.event.issue.user.login == 'gophisb' && startsWith(github.event.issue.title, 'CodePilot2 Publish:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - name: Publish edited project files
        run: |
          python3 - <<'PY'
          import os,re,base64,json,subprocess
          body=os.environ["ISSUE_BODY"]
          m=re.search(r"<!-- CodePilot2 publish\npayload_b64=(.*?)\n-->",body,re.S)
          if not m: raise SystemExit("Invalid publish request")
          data=json.loads(base64.b64decode(m.group(1),validate=True).decode("utf-8"))
          owner=data["target_owner"]; repo=data["target_repo"]
          if owner != "gophisb": raise SystemExit("Only the configured owner is allowed")
          if not re.fullmatch(r"[A-Za-z0-9-]+",owner): raise SystemExit("Invalid owner")
          if not re.fullmatch(r"[A-Za-z0-9._-]{1,100}",repo): raise SystemExit("Invalid repo")
          files=data["files"]
          if not files: raise SystemExit("No files")
          if len(files) > 200: raise SystemExit("Too many files")
          if data.get("create_repo"):
              subprocess.check_call(["gh","repo","create",f"{owner}/{repo}","--public","--description","Project uploaded by CodePilot2"])
          for f in files:
              path=f["path"].replace("\\","/").lstrip("/")
              parts=path.split("/")
              if not path or any(p in ("","..") for p in parts): raise SystemExit("Unsafe path: "+path)
              if path.startswith(".git/") or path == ".git": raise SystemExit("Unsafe path: "+path)
              encoded=base64.b64encode(f["content"].encode()).decode()
              try:
                  old=json.loads(subprocess.check_output(["gh","api",f"repos/{owner}/{repo}/contents/{path}"],text=True))
                  args=["gh","api","--method","PUT",f"repos/{owner}/{repo}/contents/{path}","-f",f"message=CodePilot2: update {path}","-f",f"content={encoded}","-f",f"sha={old['sha']}"]
              except subprocess.CalledProcessError:
                  args=["gh","api","--method","PUT",f"repos/{owner}/{repo}/contents/{path}","-f",f"message=CodePilot2: create {path}","-f",f"content={encoded}"]
              subprocess.check_call(args)
          print("Published",len(files),"files to",f"{owner}/{repo}")
          PY


  zip-push-route:
    if: github.event.issue.user.login == 'gophisb' && startsWith(github.event.issue.title, '[ZIP-PUSH]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Dispatch ZIP-PUSH
        run: |
          python3 - <<'PY'
          import os,json,urllib.request
          title=os.environ["ISSUE_TITLE"]
          prefix="[ZIP-PUSH]"
          if not title.startswith(prefix):
              raise SystemExit("Not a ZIP-PUSH issue")
          project_name=title[len(prefix):].strip()
          if not project_name:
              raise SystemExit("Missing project name")
          payload=os.environ["ISSUE_BODY"]
          if not payload:
              raise SystemExit("Missing ZIP payload")
          data={"ref":"main","inputs":{
              "project_name":project_name,
              "payload":payload,
              "issue_number":os.environ["ISSUE_NUMBER"]}}
          req=urllib.request.Request(
              "https://api.github.com/repos/gophisb/codepilot2/actions/workflows/zip-push.yml/dispatches",
              data=json.dumps(data).encode(),
              headers={"Accept":"application/vnd.github+json",
                       "Authorization":"Bearer "+os.environ["GH_TOKEN"],
                       "X-GitHub-Api-Version":"2026-03-10",
                       "Content-Type":"application/json"},
              method="POST")
          with urllib.request.urlopen(req,timeout=30) as r:
              if r.status not in (200,201,204):
                  raise SystemExit("Dispatch HTTP "+str(r.status))
          PY
