name: CodePilot2 GitHub Bridge

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  bridge:
    if: github.event.issue.user.login == 'gophisb' && startsWith(github.event.issue.title, 'CodePilot2:')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse request
        run: |
          python3 - <<'PY'
          import os,re,base64
          body=os.environ.get("ISSUE_BODY","")
          m=re.search(r"<!-- CodePilot2 request\n(.*?)\n-->",body,re.S)
          if not m: raise SystemExit("Invalid CodePilot2 request")
          meta={}
          for line in m.group(1).splitlines():
              if "=" in line:
                  k,v=line.split("=",1); meta[k.strip()]=v.strip()
          required=["request_id","project","provider","stack","platform","prompt_b64"]
          missing=[k for k in required if not meta.get(k)]
          if missing: raise SystemExit("Missing fields: "+", ".join(missing))
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,99}",meta["project"]): raise SystemExit("Invalid project")
          prompt=base64.b64decode(meta["prompt_b64"],validate=True).decode("utf-8")
          if not prompt.strip(): raise SystemExit("Empty prompt")
          with open("/tmp/codepilot.env","w") as f:
              for k in ["request_id","project","provider","stack","platform"]:
                  f.write(k.upper()+"="+meta[k]+"\n")
          with open("/tmp/prompt.txt","w") as f: f.write(prompt)
          PY
          cat /tmp/codepilot.env >> "$GITHUB_ENV"
          {
            echo "PROMPT<<__CODEPILOT__"
            cat /tmp/prompt.txt
            echo
            echo "__CODEPILOT__"
          } >> "$GITHUB_ENV"
      - name: Start CodePilot
        run: |
          set -euo pipefail
          gh workflow run codepilot-run.yml --repo "${{ github.repository }}" --ref main             -f prompt="$PROMPT" -f provider="$PROVIDER" -f stack="$STACK"             -f platform="$PLATFORM" -f project="$PROJECT" -f request_id="$REQUEST_ID"
      - name: Comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "${{ github.repository }}"             --body "تم استلام طلب CodePilot2 وتشغيل GitHub. معرّف الطلب: $REQUEST_ID."
