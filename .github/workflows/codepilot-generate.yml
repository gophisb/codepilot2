name: CodePilot - Generate Project
run-name: "CodePilot: ${{ inputs.project }} [${{ inputs.request_id }}]"

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "وصف التطبيق المطلوب"
        required: true
        type: string
      provider:
        description: "مزود الذكاء الاصطناعي"
        required: true
        default: "gemini"
        type: choice
        options: [gemini, deepseek, openai, openrouter]
      stack:
        description: "التقنية"
        required: true
        default: "HTML/CSS/JS"
        type: string
      platform:
        description: "المنصة"
        required: true
        default: "Web / PWA"
        type: string
      project:
        description: "اسم المستودع الجديد للمشروع"
        required: true
        default: "my-codepilot-app"
        type: string
      request_id:
        description: "معرف طلب التوليد"
        required: true
        default: "manual"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PROVIDER: ${{ inputs.provider }}
      PROMPT: ${{ inputs.prompt }}
      STACK: ${{ inputs.stack }}
      PLATFORM: ${{ inputs.platform }}
      PROJECT: ${{ inputs.project }}
      REQUEST_ID: ${{ inputs.request_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate project
        run: python3 .github/scripts/generate.py

      - name: Validate and publish
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$PROJECT" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,99}$ ]]; then
            echo "Invalid GitHub repository name"
            exit 1
          fi
          test -d generated-project
          test -n "$(find generated-project -type f -print -quit)"
          (cd generated-project && zip -qr ../codepilot-generated-project.zip .)

          owner="$(gh api user --jq .login)"
          candidate="$PROJECT"
          n=2
          while gh repo view "$owner/$candidate" >/dev/null 2>&1; do
            candidate="$PROJECT-$n"
            n=$((n+1))
          done

          if [[ "$PLATFORM" =~ (Web|PWA) ]]; then
            mkdir -p generated-project/.github/workflows
            cat > generated-project/.github/workflows/deploy-pages.yml <<'YAML'
name: Build and deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v6
        if: hashFiles("package.json") != ""
        with:
          node-version: 20
      - name: Install
        if: hashFiles("package.json") != ""
        run: npm install
      - name: Build
        if: hashFiles("package.json") != ""
        run: npm run build --if-present
      - name: Select output
        run: |
          if [ -d dist ]; then echo "PAGES_DIR=dist" >> "$GITHUB_ENV"
          elif [ -d build ]; then echo "PAGES_DIR=build" >> "$GITHUB_ENV"
          elif [ -d out ]; then echo "PAGES_DIR=out" >> "$GITHUB_ENV"
          else echo "PAGES_DIR=." >> "$GITHUB_ENV"
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_DIR }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/deploy-pages@v4
YAML
          fi

          cd generated-project
          git init
          git config user.name "CodePilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "CodePilot: initial project"
          gh repo create "$owner/$candidate" --public --description "Generated by CodePilot2-gophisb" --source . --remote origin --push
          cd ..

          if [[ "$PLATFORM" =~ (Web|PWA) ]]; then
            gh api --method POST "repos/$owner/$candidate/pages" -f build_type=workflow -f "source[branch]=main" -f "source[path]=/" >/dev/null 2>&1 || true
            printf "https://%s.github.io/%s/\n" "$owner" "$candidate" > pages-url.txt
          fi
          printf "https://github.com/%s/%s\n" "$owner" "$candidate" > target-repo.txt
          printf "# CodePilot2 generation\n\nRepository: https://github.com/%s/%s\n" "$owner" "$candidate" > codepilot-result.txt
          echo "Repository: https://github.com/$owner/$candidate" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepilot-${{ inputs.project }}
          path: |
            codepilot-generated-project.zip
            codepilot-result.txt
            generation-summary.md
            generation-meta.json
          if-no-files-found: error
