run-name: "CodePilot: ${{ inputs.project }} [${{ inputs.request_id }}]"

name: CodePilot - Generate Project

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "وصف التطبيق المطلوب"
        required: true
        type: string
      provider:
        description: "مزود الذكاء الاصطناعي"
        required: true
        default: "gemini"
        type: choice
        options: [gemini, deepseek, openai, openrouter]
      stack:
        description: "التقنية"
        required: true
        default: "HTML/CSS/JS"
        type: string
      platform:
        description: "المنصة"
        required: true
        default: "Web / PWA"
        type: string
      project:
        description: "اسم المستودع الجديد للمشروع"
        required: true
        default: "my-codepilot-app"
        type: string
      request_id:
        description: "معرف طلب التوليد"
        required: true
        default: "manual"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      PROVIDER: ${{ inputs.provider }}
      PROMPT: ${{ inputs.prompt }}
      STACK: ${{ inputs.stack }}
      PLATFORM: ${{ inputs.platform }}
      PROJECT: ${{ inputs.project }}
      REQUEST_ID: ${{ inputs.request_id }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          python3 - <<'PY'
          import os,re
          project=os.environ["PROJECT"].strip()
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{0,99}", project):
              raise SystemExit("Invalid GitHub repository name: "+project)
          if not os.environ.get("GH_REPO_TOKEN"):
              raise SystemExit("Missing GH_REPO_TOKEN")
          PY

      - name: Generate project with AI
        run: python3 .github/scripts/generate.py

      - name: Validate generated project
        run: |
          test -f generated-project/index.html || true
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path("generated-project")
          files=list(root.rglob("*"))
          if not any(p.is_file() for p in files):
              raise SystemExit("Generated project is empty")
          print("Validation passed:",sum(p.is_file() for p in files),"files")
          PY

      - name: Package generated project
        run: |
          cd generated-project
          zip -qr ../codepilot-generated-project.zip .
          cd ..
          printf '%s\n' "# CodePilot2-gophisb generation" "" "Project: $PROJECT" "Provider: $PROVIDER" "Stack: $STACK" "Platform: $PLATFORM" > codepilot-result.txt

      - name: Upload generated files artifact
        uses: actions/upload-artifact@v4
        with:
          name: codepilot-${{ inputs.project }}
          path: |
            codepilot-generated-project.zip
            codepilot-result.txt
            generation-summary.md
            generation-meta.json
          if-no-files-found: error

      - name: Create independent GitHub repository
        env:
          GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse,pathlib
          token=os.environ["GH_TOKEN"]
          project=os.environ["PROJECT"].strip()
          def request(method,url,payload=None):
            headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2026-03-10"}
            data=json.dumps(payload).encode() if payload is not None else None
            req=urllib.request.Request(url,data=data,headers=headers,method=method)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:return json.loads(r.read().decode())
            except urllib.error.HTTPError as e:
              body=e.read().decode("utf-8","replace")
              raise SystemExit(f"GitHub API error {e.code}: {body[:1600]}")
          # Never overwrite an existing repository. If the requested name is already taken,
          # choose the next available deterministic name (project-2, project-3, ...).
          base=project
          candidate=base
          suffix=2
          owner=request("GET","https://api.github.com/user")["login"]
          while True:
            try:
              request("GET","https://api.github.com/repos/"+urllib.parse.quote(owner,safe="")+"/"+urllib.parse.quote(candidate,safe=""))
              candidate=f"{base}-{suffix}"
              suffix+=1
              if len(candidate)>100:
                trimmed=base[:100-len(str(suffix))-1].rstrip("-._")
                candidate=trimmed+"-"+str(suffix)
            except SystemExit as ex:
              if "GitHub API error 404:" in str(ex):
                break
              raise
          repo=request("POST","https://api.github.com/user/repos",{
            "name":candidate,
            "description":"Generated by CodePilot2-gophisb",
            "private":False,
            "has_issues":True,
            "has_projects":False,
            "has_wiki":False
          })
          print("Requested repository: "+project)
          print("Created repository: "+repo["html_url"])
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            f.write("## CodePilot2-gophisb result\n\n")
            f.write("**Requested name:** `"+project+"`\n\n")
            if candidate != project:
              f.write("**Name already existed; created safely as:** `"+candidate+"`\n\n")
            f.write("**Repository:** "+repo["html_url"]+"\n\n")
            f.write("**Load into CodePilot2-gophisb:** paste the repository URL into the loader.\n")
          pathlib.Path("target_repo.txt").write_text(repo["clone_url"],encoding="utf-8")

      - name: Publish project to new repository
        env:
          GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          CLONE_URL="$(cat target_repo.txt)"
          echo "Target repository: $CLONE_URL"

          # Authenticate Git using the same token that created the target repository.
          # This avoids relying on an HTTP extra-header being accepted by Git's HTTPS transport.
          gh auth setup-git

          # Add a real build/deploy workflow to generated web projects.
          # It installs Node dependencies and publishes dist/build/out through GitHub Pages.
          if [[ "$PLATFORM" == *"Web"* || "$PLATFORM" == *"PWA"* ]]; then
            mkdir -p generated-project/.github/workflows
            cat > generated-project/.github/workflows/deploy-pages.yml <<'YAML'
name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        if: hashFiles('package.json') != ''
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then npm ci; else npm install; fi
      - name: Build web project
        if: hashFiles('package.json') != ''
        run: npm run build --if-present
      - name: Select Pages output
        run: |
          if [ -d dist ]; then echo "PAGES_DIR=dist" >> "$GITHUB_ENV"; elif [ -d build ]; then echo "PAGES_DIR=build" >> "$GITHUB_ENV"; elif [ -d out ]; then echo "PAGES_DIR=out" >> "$GITHUB_ENV"; else echo "PAGES_DIR=." >> "$GITHUB_ENV"; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ env.PAGES_DIR }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
YAML
          fi
          cd generated-project
          git init          # git init creates a fresh local repository, so identity must be configured
          # after initialization (configuring it before git init is lost).
          git config user.name "CodePilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b main
          git add .
          git commit -m "CodePilot: initial project"
          git remote remove origin 2>/dev/null || true
          git remote add origin "$CLONE_URL"

          # The new repository is intentionally empty, so publish the generated
          # commit explicitly as the target default branch.
          git push --set-upstream origin HEAD:main

          cd ..
          echo "Published project repository: $CLONE_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "CodePilot2-gophisb main was not modified." >> "$GITHUB_STEP_SUMMARY"
      - name: Configure GitHub Pages
        if: contains(inputs.platform, 'Web') || contains(inputs.platform, 'PWA')
        env:
          GH_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error,pathlib

          token=os.environ["GH_TOKEN"]
          target=pathlib.Path("target_repo.txt").read_text(encoding="utf-8").strip()
          repo_path=target.split("github.com/",1)[-1].removesuffix(".git").strip("/")
          owner,project=repo_path.split("/",1)
          api="https://api.github.com/repos/"+owner+"/"+project
          headers={"Accept":"application/vnd.github+json","Authorization":"Bearer "+token,"X-GitHub-Api-Version":"2026-03-10","Content-Type":"application/json"}

          def request(method,url,payload=None):
            data=json.dumps(payload).encode() if payload is not None else None
            req=urllib.request.Request(url,data=data,headers=headers,method=method)
            try:
              with urllib.request.urlopen(req,timeout=30) as r:
                body=r.read().decode("utf-8","replace")
                return r.status, (json.loads(body) if body else {})
            except urllib.error.HTTPError as e:
              body=e.read().decode("utf-8","replace")
              return e.code, body

          pages_api=api+"/pages"
          status,body=request("POST",pages_api,{"build_type":"workflow","source":{"branch":"main","path":"/"}})
          if status==409:
            status2,body2=request("PUT",pages_api,{"build_type":"workflow","source":{"branch":"main","path":"/"}})
            if status2 not in (200,204):
              raise SystemExit("GitHub Pages workflow configuration failed: HTTP "+str(status2)+" "+str(body2)[:1200])
          elif status not in (201,202):
            raise SystemExit("GitHub Pages creation failed: HTTP "+str(status)+" "+str(body)[:1200])

          pages_url="https://"+owner+".github.io/"+project+"/"
          pathlib.Path("pages-url.txt").write_text(pages_url+"\n",encoding="utf-8")
          pathlib.Path("target-pages-repo.txt").write_text(owner+"/"+project+"\n",encoding="utf-8")
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as f:
            f.write("\n## Public GitHub Pages\n\n**URL:** "+pages_url+"\n\nSource: GitHub Actions workflow / main\n")
          print("GitHub Pages workflow configured: "+pages_url)

          dispatch_api=api+"/actions/workflows/deploy-pages.yml/dispatches"
          dstatus,dbody=request("POST",dispatch_api,{"ref":"main"})
          if dstatus not in (200,201,204):
            print("Workflow dispatch warning: HTTP "+str(dstatus)+" "+str(dbody)[:1000])
          else:
            print("Target Pages build dispatched.")
          PY

      - name: Verify GitHub Pages entry point
        if: contains(inputs.platform, 'Web') || contains(inputs.platform, 'PWA')
        run: |
          set -euo pipefail
          test -s pages-url.txt
          test -s target-pages-repo.txt
          echo "Pages workflow and public URL are ready for $(cat target-pages-repo.txt)."

